<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Société CASH - Congo Assainissement, Santé et Hygiène</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b0b0b;
            color: #ffffff;
        }
        /* Top bar */
        .top-bar {
            background-color: #000;
            display: flex;
            justify-content: flex-end;
            gap: 30px;
            padding: 10px 5%;
            font-size: 14px;
            border-bottom: 1px solid #222;
        }
        .top-bar div {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        /* Header / Nav */
        header {
            background-color: #000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 5%;
            border-bottom: 3px solid #ffcc00;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .logo-box {
            background-color: #000;
            border: 2px solid #ffcc00;
            padding: 5px 12px;
            font-weight: bold;
            font-size: 24px;
            letter-spacing: 2px;
            color: #fff;
        }
        .logo-box span { color: #ffcc00; }
        .logo-sub {
            font-size: 11px;
            letter-spacing: 1px;
            color: #ffcc00;
            font-weight: bold;
        }
        nav ul {
            display: flex;
            list-style: none;
            gap: 25px;
            align-items: center;
        }
        nav a {
            color: #fff;
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            transition: 0.3s;
        }
        nav a:hover, nav a.active {
            color: #ffcc00;
        }
        .search-btn {
            background-color: #ffcc00;
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        /* Hero Section */
        .hero {
            position: relative;
            background: linear-gradient(90deg, #0b0b0b 50%, rgba(11,11,11,0.7) 100%), url('https://images.unsplash.com/photo-1581578731548-c64695cc6952?auto=format&fit=crop&w=1500&q=80') no-repeat right center/cover;
            padding: 80px 5%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 500px;
        }
        .hero-content {
            max-width: 600px;
            border-left: 5px solid #ffcc00;
            padding-left: 20px;
        }
        .hero h1 {
            font-size: 42px;
            line-height: 1.2;
            margin-bottom: 20px;
            font-style: italic;
        }
        .hero p {
            font-size: 15px;
            color: #ccc;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .hero-btns {
            display: flex;
            gap: 15px;
        }
        .btn-yellow {
            background-color: #ffcc00;
            color: #000;
            padding: 12px 25px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 4px;
            transition: 0.3s;
        }
